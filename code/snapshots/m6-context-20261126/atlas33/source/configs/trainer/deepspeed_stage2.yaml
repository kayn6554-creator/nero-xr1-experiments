# @package _global_

trainer:
  accelerator: "gpu"
  devices: "auto"
  precision: "16-mixed"
  num_nodes: 1

  strategy:
    type: deepspeed
    params:
      stage: 2
      allgather_bucket_size: 5e8
      reduce_bucket_size: 5e8

  optimizer:
    type: "torch.optim.AdamW"
    params:
      lr: 1.0
      betas: [0.9, 0.95]
      weight_decay: 0.1
      eps: 1.0e-08

  scheduler:
    type: mibot.utils.cosine_warmup.get_cosine_schedule_with_warmup
    params:
      num_training_steps: ${trainer.max_steps}
      num_warmup_steps: 100
      warmup_lr_start: 5e-7
      max_lr: 5e-6
      min_lr: 1e-6

  seed: 0
  max_steps: 2000
  save_interval: 250
  accumulate_grad_batches: 8
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"

  project: "xr1-stage2"
  exp_name: "replace-me"
  default_root_dir: "./stage2-runs/replace-me"

  # Null for a fresh Stage 2 optimizer/scheduler/global step. Set only to a
  # checkpoint produced by this Stage 2 experiment when resuming Stage 2.
  ckpt_path: null
  profiler: null
  enable_progress_bar: true