# @package _global_

model:
  type: "BaseRunner"
  params:
    pretrained: /mnt/wzh/checkpoints/Xiaomi-Robotics-1-5B/model_states.pt
    model:
      type: "xr1"
      freq_coefficient: 1.0
      freq_excluded_dims: []
      ffn_gradient_checkpointing: true
      async_train: false
      action_layout: nero_ee
      training_repeat: 4
      model_dtype: bfloat16
      attn_implementation: sdpa
      vlm_config_path: /mnt/wzh/checkpoints/Qwen3-VL-4B-Instruct
      skip_vlm_init: true
      freeze_input_embeddings: false
      reset_action_boundaries: false
      vlm_lora:
        enabled: false
        r: 16
        alpha: 32
        dropout: 0.05
        target_modules: [q_proj, k_proj, v_proj, o_proj]
