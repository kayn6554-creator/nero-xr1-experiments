# @package _global_

trainer:
  accelerator: "auto"
  precision: "bf16-mixed"
  num_nodes: -1

  strategy:
    type: deepspeed
    params:
      stage: 2
      allgather_bucket_size: 2e8
      reduce_bucket_size: 2e8

  optimizer:
    type: "deepspeed.ops.adam.FusedAdam"
    params:
      lr: 1.0
      betas: [0.9, 0.95]
      weight_decay: 0.1
      eps: 1.0e-08

  scheduler:
    type: mibot.utils.cosine_warmup.get_cosine_schedule_with_warmup
    params:
      num_training_steps: ${trainer.max_steps}
      num_warmup_steps: 500
      warmup_lr_start: 5e-7
      max_lr: 5e-6
      min_lr: 5e-7

  seed: 42
  max_steps: 21556
  save_interval: 1000
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"

  project: "xr1-910c-joint-full"
  exp_name: "robodojo-real4"
  default_root_dir: "/mnt/wzh/output/xr1-910c-joint-full"

  ckpt_path: null
  profiler: null
  enable_progress_bar: true
