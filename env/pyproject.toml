[project]
name = "xr1"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate==1.11.0",
    "decorator>=5.3.1",
    "deepspeed==0.18.9",
    "h5py>=3.16.0",
    "hydra-core==1.3.2",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "lightning==2.5.3",
    "mmengine==0.10.7",
    "msgpack>=1.0,<2",
    "numpy>=1.23",
    "omegaconf==2.3.0",
    "opencv-python==4.12.0.88",
    "opencv-python-headless==4.12.0.88",
    "pillow==11.3.0",
    "pyarrow==18.1.0",
    "pyyaml>=6",
    "safetensors==0.6.2",
    "scipy>=1.15.3",
    "tensorboard==2.20.0",
    "torch==2.9.0",
    "torch-npu==2.9.0.post2",
    "torchvision==0.24.0",
    "tqdm>=4.70.0",
    "transformers==4.57.1",
    "wandb==0.23.1",
    "websockets>=14,<16",
